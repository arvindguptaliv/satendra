name: terraform ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  permissions:
    id-token: write
    contents: read

  jobs:
    terraform:
      runs-on: ubuntu-latest

      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: setup terraform
          uses: hashicorp/setup-terraform@v3

        - name: terraform init
          run: terraform init

        - name: terraform validate
          run: terraform validate

        - name: terraform plan
          run: terraform plan